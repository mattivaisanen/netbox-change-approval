[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-change-approval"
version = "0.5.1"
description = "Require approval-group sign-off on changes to NetBox objects before they take effect, with auto-approval rules and a bypass permission for trusted users."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Matti" }]
requires-python = ">=3.10"
# NetBox itself provides Django and everything else the plugin uses. The
# supported NetBox versions are checked at startup (min_version in
# netbox_change_approval/__init__.py).
dependencies = []
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/mattivaisanen/netbox-change-approval"
Documentation = "https://github.com/mattivaisanen/netbox-change-approval/tree/master/docs"
Changelog = "https://github.com/mattivaisanen/netbox-change-approval/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["netbox_change_approval*"]

# Templates are not Python files, so they must be listed to end up in the wheel.
[tool.setuptools.package-data]
netbox_change_approval = ["templates/**/*.html"]
