<style>
  /* table_styling.py's PENDING_ROW_CSS_CLASS. box-shadow, not border: borders on
     <tr>/<td> interact badly with border-collapse (double/missing lines at
     shared edges); an inset box-shadow draws cleanly regardless, and doesn't
     shift layout the way an actual border would. --tblr-warning matches the
     list-view "N pending approval" badge's own btn-outline-warning color.
     All four sides are a uniform 1px — inset box-shadows are clipped to the
     element's own border-radius, so first/last child also get rounded outer
     corners (--tblr-border-radius-sm matches the theme's small-radius
     elements, e.g. badges/buttons) without needing a real border. */
  tr.nbca-pending-row > td {
    box-shadow: inset 0 1px 0 0 var(--tblr-warning), inset 0 -1px 0 0 var(--tblr-warning);
  }
  tr.nbca-pending-row > td:first-child {
    box-shadow: inset 1px 0 0 0 var(--tblr-warning), inset 0 1px 0 0 var(--tblr-warning), inset 0 -1px 0 0 var(--tblr-warning);
    border-top-left-radius: var(--tblr-border-radius-sm, 2px);
    border-bottom-left-radius: var(--tblr-border-radius-sm, 2px);
  }
  tr.nbca-pending-row > td:last-child {
    box-shadow: inset -1px 0 0 0 var(--tblr-warning), inset 0 1px 0 0 var(--tblr-warning), inset 0 -1px 0 0 var(--tblr-warning);
    border-top-right-radius: var(--tblr-border-radius-sm, 2px);
    border-bottom-right-radius: var(--tblr-border-radius-sm, 2px);
  }
</style>
