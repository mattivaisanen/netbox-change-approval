{% load i18n %}
{% include 'netbox_change_approval/inc/confirm_modal.html' %}
{# Approval Inbox button at the top of the sidebar, between the NetBox logo and the first menu. NetBox has no plugin hook there, so it's rendered in <head> and moved into place once the page loads. #}
<style>
  /* Active change set: a soft glow. The icon fades brighter and dimmer and a
     faint blue halo breathes around the button, about every 2 seconds. */
  @keyframes nbca-cs-icon { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  @keyframes nbca-cs-halo {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--tblr-primary-rgb, 32, 107, 196), .0); }
    50% { box-shadow: 0 0 .55rem .1rem rgba(var(--tblr-primary-rgb, 32, 107, 196), .45); }
  }
  .nbca-cs-active { display: inline-block; animation: nbca-cs-icon 2s ease-in-out infinite; }
  .nbca-cs-button { animation: nbca-cs-halo 2s ease-in-out infinite; }
  .nbca-inbox-count { justify-content: center; flex: 0 0 auto; }
  /* Approvals waiting: red outline, faint red fill, bold number and a red
     glow inside the box that breathes like the active change set button.
     Inside, so it never spills into the gaps between the buttons. */
  @keyframes nbca-count-halo {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(var(--tblr-red-rgb, 214, 57, 57), 0); }
    50% { box-shadow: inset 0 0 .35rem .15rem rgba(var(--tblr-red-rgb, 214, 57, 57), .9); }
  }
  .nbca-inbox-count-urgent {
    background-color: rgba(var(--tblr-red-rgb, 214, 57, 57), .18);
    font-weight: 700;
    animation: nbca-count-halo 2s ease-in-out infinite;
  }
  /* Background refresh (see the script below): a count that changed pops
     once; widget rows fade in blue when new, flash amber when changed and
     slide out when gone; switching between rows and the idle drawing fades in. */
  @keyframes nbca-count-pop { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.3); } }
  @keyframes nbca-row-in {
    from { opacity: 0; background-color: rgba(var(--tblr-primary-rgb, 32, 107, 196), .25); }
    30% { opacity: 1; }
    to { background-color: transparent; }
  }
  @keyframes nbca-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .nbca-inbox-count.nbca-count-pop { animation: nbca-count-pop .5s ease-out, nbca-count-halo 2s ease-in-out .5s infinite; }
  .nbca-inbox-count.nbca-count-pop:not(.nbca-inbox-count-urgent) { animation: nbca-count-pop .5s ease-out; }
  tr.nbca-live-new > td { animation: nbca-row-in 2.5s ease-out; }
  @keyframes nbca-row-changed {
    from { background-color: rgba(var(--tblr-yellow-rgb, 245, 159, 0), .35); }
    to { background-color: transparent; }
  }
  tr.nbca-live-changed > td { animation: nbca-row-changed 2.5s ease-out; }
  tr.nbca-live-gone > td { transition: opacity .35s ease-in, transform .35s ease-in; opacity: 0; transform: translateX(1.5rem); }
  .nbca-live-widget.nbca-live-fade { animation: nbca-fade-in .4s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .nbca-cs-active, .nbca-cs-button, .nbca-inbox-count-urgent, .nbca-inbox-count.nbca-count-pop,
    tr.nbca-live-new > td, tr.nbca-live-changed > td, .nbca-live-widget.nbca-live-fade { animation: none; }
    tr.nbca-live-gone > td { transition: none; }
  }
</style>
<template id="nbca-inbox-nav">
  {% include 'netbox_change_approval/inc/inbox_nav_button.html' %}
</template>
<script>
  (function () {
    // Count box: exactly the size of the change set button.
    function sizeCount(nav) {
      var cs = nav.querySelector('.nbca-cs-button, .nbca-cs-button-idle');
      var counter = nav.querySelector('.nbca-inbox-count');
      if (cs && counter) {
        counter.style.width = cs.offsetWidth + 'px';
        counter.style.height = cs.offsetHeight + 'px';
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      var tpl = document.getElementById('nbca-inbox-nav');
      var menu = document.getElementById('sidebar-menu');
      if (!tpl || !menu || menu.querySelector('.nbca-inbox-nav')) return;
      menu.insertBefore(tpl.content.cloneNode(true), menu.firstChild);
      sizeCount(menu.querySelector('.nbca-inbox-nav'));
    });

    /* Background refresh: every 10 seconds while the tab is visible (and at
       once when you come back to it), redraw the sidebar count and the
       Pending Approvals widget if anything changed. The widget waits while
       a dialog or a quick view is open, so nothing moves under your hands.
       Stops for good once you're signed out. */
    if (window.nbcaLive) return;
    var URL = "{% url 'plugins:netbox_change_approval:live_refresh' %}";
    var EVERY = 10000;
    var busy = false, again = false, stopped = false, last = Date.now(), lastNav = null;

    function swapNav(html) {
      var current = document.querySelector('#sidebar-menu .nbca-inbox-nav');
      if (!current || !html || html === lastNav) return;
      var tpl = document.createElement('template');
      tpl.innerHTML = html.trim();
      var fresh = tpl.content.firstElementChild;
      if (!fresh) return;
      var before = current.querySelector('.nbca-inbox-count');
      current.replaceWith(fresh);
      sizeCount(fresh);
      var after = fresh.querySelector('.nbca-inbox-count');
      if (after && lastNav !== null && (!before || before.textContent !== after.textContent)) {
        after.classList.add('nbca-count-pop');
      }
      lastNav = html;
    }

    function widgetBusy(root) {
      return document.querySelector('.modal.show') ||
        root.querySelector('.nbca-quick.show, .nbca-quick.collapsing');
    }

    var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Widget rows by quick view id, with the text that counts as "changed":
    // title, badges and who or comment. The age column is left out, as it
    // changes on its own.
    function widgetRows(el) {
      var rows = {};
      el.querySelectorAll('.nbca-toggle[data-bs-target]').forEach(function (toggle) {
        var row = toggle.closest('tr');
        var text = Array.prototype.slice.call(row.cells, 0, 2).map(function (cell) {
          return cell.textContent.replace(/\s+/g, ' ').trim() + '|' + (cell.title || '');
        }).join('|');
        rows[toggle.getAttribute('data-bs-target')] = {row: row, text: text};
      });
      return rows;
    }

    /* Every change is animated: rows that left fade out first, then new rows
       fade in with a blue highlight and changed rows flash amber. Switching
       between rows and the idle drawing fades the whole widget in. */
    function swapWidget(root, html) {
      if (!document.contains(root)) return;
      var fragment = document.createRange().createContextualFragment(html);
      var fresh = fragment.firstElementChild;
      if (!fresh) return;
      var before = widgetRows(root), after = widgetRows(fresh);
      var hadRows = Object.keys(before).length > 0, hasRows = Object.keys(after).length > 0;
      var gone = Object.keys(before).filter(function (id) { return !after[id]; });

      function put() {
        if (!document.contains(root)) return;
        // Scripts in a contextual fragment run when inserted, as on page load.
        root.replaceWith(fragment);
        if (hadRows !== hasRows) { fresh.classList.add('nbca-live-fade'); return; }
        Object.keys(after).forEach(function (id) {
          if (!before[id]) after[id].row.classList.add('nbca-live-new');
          else if (before[id].text !== after[id].text) after[id].row.classList.add('nbca-live-changed');
        });
      }

      if (!gone.length || !hasRows || reducedMotion) { put(); return; }
      gone.forEach(function (id) { window.nbcaLive.fadeOutRow(before[id].row); });
      setTimeout(put, 400);
    }

    // A row leaving the widget (also used by Mark as read): fade it and its
    // quick view out, then remove them, or call `done` instead of removing.
    function fadeOutRow(row, done) {
      var quick = row.nextElementSibling;
      if (quick && !quick.classList.contains('nbca-quick')) quick = null;
      var finish = done || function () { if (quick) quick.remove(); row.remove(); };
      if (reducedMotion) { finish(); return; }
      row.classList.add('nbca-live-gone');
      if (quick) quick.classList.add('nbca-live-gone');
      if (!done) setTimeout(finish, 400);
    }

    function refresh() {
      if (busy) { again = true; return; }
      if (stopped || document.hidden) return;
      busy = true;
      last = Date.now();
      var root = document.querySelector('[data-nbca-live="widget"]');
      // A busy widget sends no signature, so it's left as it is this time.
      var sendSig = root && !widgetBusy(root);
      var url = URL + '?path=' + encodeURIComponent(window.location.pathname) +
        (sendSig ? '&sig=' + encodeURIComponent(root.getAttribute('data-nbca-sig') || '') : '');
      fetch(url, {credentials: 'same-origin', headers: {'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest'}})
        .then(function (response) {
          if (response.redirected || response.status === 401 || response.status === 403 || response.status === 404) {
            stopped = true;  // signed out (or the plugin is gone)
            return null;
          }
          return response.ok ? response.json() : null;
        })
        .then(function (data) {
          if (!data) return;
          swapNav(data.nav);
          if (sendSig && data.widget && !widgetBusy(root)) swapWidget(root, data.widget);
        })
        .catch(function () { /* offline for a moment: try again next time */ })
        .then(function () {
          busy = false;
          if (again) { again = false; refresh(); }
        });
    }

    window.nbcaLive = {refresh: refresh, fadeOutRow: fadeOutRow};
    setInterval(refresh, EVERY);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && Date.now() - last >= EVERY) refresh();
    });
  })();
</script>
