{% load i18n %}
{% include 'netbox_change_approval/inc/confirm_modal.html' %}
{# Approval Inbox button at the top of the sidebar, between the NetBox logo and the first menu. NetBox has no plugin hook there, so it's rendered in <head> and moved into place once the page loads. #}
<style>
  /* Active change set: a soft glow. The icon fades brighter and dimmer and a
     faint blue halo breathes around the button, about every 2 seconds. */
  @keyframes nbca-cs-icon { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  @keyframes nbca-cs-halo {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--tblr-primary-rgb, 32, 107, 196), .0); }
    50% { box-shadow: 0 0 .55rem .1rem rgba(var(--tblr-primary-rgb, 32, 107, 196), .45); }
  }
  .nbca-cs-active { display: inline-block; animation: nbca-cs-icon 2s ease-in-out infinite; }
  .nbca-cs-button { animation: nbca-cs-halo 2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .nbca-cs-active, .nbca-cs-button { animation: none; } }
</style>
<template id="nbca-inbox-nav">
  <div class="nbca-inbox-nav px-3 mt-2 mb-1 d-flex gap-1">
    <a href="{% url 'plugins:netbox_change_approval:changerequest_inbox' %}"
       class="btn {% if approval_count %}btn-outline-primary{% else %}btn-outline-secondary{% endif %} flex-grow-1 justify-content-between{% if active %} active{% endif %}"
       title="{% trans 'Change requests waiting on you' %}">
      <span><i class="mdi mdi-inbox{% if count %}-full{% endif %}-outline me-1"></i>{% trans "Approval Inbox" %}</span>
      {% if count %}<span class="badge {% if approval_count %}text-bg-red{% else %}text-bg-secondary{% endif %} ms-2"{% if not approval_count %} title="{% trans 'Field work only' %}"{% endif %}>{{ count }}</span>{% endif %}
    </a>
    {% if change_set_button %}
      {% if active_change_set %}
      <a href="{{ active_change_set.get_absolute_url }}" class="btn btn-outline-primary active px-2 nbca-cs-button"
         title="{% blocktrans with name=active_change_set.name %}Working in change set: {{ name }}{% endblocktrans %}"
         aria-label="{% trans 'Open the active change set' %}"><i class="mdi mdi-package-variant-closed m-0 nbca-cs-active"></i></a>
      {% else %}
      <a href="{% url 'plugins:netbox_change_approval:changeset_list' %}" class="btn btn-outline-secondary px-2"
         title="{% trans 'Start a change set' %}" aria-label="{% trans 'Start a change set' %}"><i class="mdi mdi-package-variant-plus m-0"></i></a>
      {% endif %}
    {% endif %}
  </div>
</template>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var tpl = document.getElementById('nbca-inbox-nav');
    var menu = document.getElementById('sidebar-menu');
    if (!tpl || !menu || menu.querySelector('.nbca-inbox-nav')) return;
    menu.insertBefore(tpl.content.cloneNode(true), menu.firstChild);
  });
</script>
